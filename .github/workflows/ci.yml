name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      KOKKOS_VERSION: 5.2.2
      KOKKOS_ROOT: ${{ github.workspace }}/kokkos-install
    steps:
      - uses: actions/checkout@v4

      - name: Check version and author
        run: ./scripts/checkVersion.sh

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ libopenmpi-dev openmpi-bin libfftw3-dev

      - name: Cache Kokkos
        id: kokkos-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.KOKKOS_ROOT }}
          key: kokkos-${{ env.KOKKOS_VERSION }}-${{ runner.os }}

      - name: Build Kokkos (Serial + OpenMP)
        if: steps.kokkos-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o kokkos.tar.gz \
            "https://github.com/kokkos/kokkos/archive/refs/tags/${KOKKOS_VERSION}.tar.gz"
          tar xzf kokkos.tar.gz
          cmake -S "kokkos-${KOKKOS_VERSION}" -B kokkos-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${KOKKOS_ROOT}" \
            -DKokkos_ENABLE_SERIAL=ON \
            -DKokkos_ENABLE_OPENMP=ON \
            -DKokkos_ENABLE_TESTS=OFF \
            -DKokkos_ENABLE_EXAMPLES=OFF
          cmake --build kokkos-build
          cmake --install kokkos-build

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DKokkos_ROOT="${KOKKOS_ROOT}" \
            -DSATURN_DEFAULT_SPACE=openmp \
            -DSATURN_ENABLE_TESTS=ON \
            -DSATURN_ENABLE_WARNINGS=ON \
            -DSATURN_ENABLE_MPI=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install clang-format
        run: pip install clang-format==23.1.3
      - name: Check formatting
        run: |
          find src apps tests -type f \( -name '*.hpp' -o -name '*.cpp' \) \
            -print0 | xargs -0 clang-format --dry-run --Werror
